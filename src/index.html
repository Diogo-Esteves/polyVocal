<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PolyVocal</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 1.5rem;
        color: #1a1a1a;
      }
      .app {
        max-width: 640px;
        margin: 0 auto;
      }
      section {
        margin-top: 1.5rem;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      .transcript-lines {
        min-height: 4rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 0.75rem;
      }
      .error {
        color: #b00020;
      }
      .translated {
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 0.75rem;
        min-height: 2rem;
      }
    </style>
  </head>
  <body></body>
</html>
