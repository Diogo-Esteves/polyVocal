[package]
name = "polyvocal-ui"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "polyvocal-ui"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
futures = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Storage", "Window", "NodeList"] }

[dependencies.tauri-sys]
git = "https://github.com/JonasKruckenberg/tauri-sys"
branch = "v2"
features = ["core", "event"]

[profile.release]
opt-level = "s"
