[package]
name = "polyvocal"
version = "0.1.0"
description = "PolyVocal — fast, local, cross-platform speech-to-text with translation"
authors = ["Diogo Esteves"]
license = "MIT"
repository = "https://github.com/Diogo-Esteves/polyVocal"
edition = "2021"
rust-version = "1.88" # ort (Silero VAD inference) requires 1.88+

# Tauri build profile — minimise binary size in release
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[lib]
name = "polyvocal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "polyvocal"
path = "src/main.rs"

# ─── Core dependencies ────────────────────────────────────────────────────────

[dependencies]
# Tauri — desktop app framework
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio capture (cross-platform microphone input)
cpal = "0.15"

# Audio resampling — fast resampler for 16kHz conversion
rubato = "0.15"

# Whisper inference — Rust bindings over whisper.cpp
# NOTE: requires whisper.cpp to be built; see build.rs
whisper-rs = "0.16"

# Storage — async SQLite
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "uuid", "chrono"] }

# IDs and timestamps
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Checksums — SHA256 verification of downloaded model files
sha2 = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Rotating on-disk log file (DEC-018) — a bundled app launched from a
# menu/dock has no terminal, so stdout-only logging is invisible.
tracing-appender = "0.2"
# Resolves the platform app-data directory at logging-init time, before
# Tauri's `App` (and so `app.path().app_data_dir()`) exists. Same crate,
# same version Tauri itself resolves those paths with — see logging.rs.
dirs = "6"

# Language detection — resolves a session's source language locally when
# it wasn't recorded at transcription time, so the translation engine
# always has a concrete source/target pair to route (see
# translation::engine::detect_language).
whatlang = "0.16"

# Model downloads (Whisper/Silero/OPUS-MT weights, all fetched from HuggingFace)
reqwest = { version = "0.13", features = ["json", "rustls", "stream"], default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ort = "2.0.0-rc.13"

# Translation inference — OPUS-MT (MarianMT) via candle, per DEC-010.
# Default (no `mkl`/`accelerate`/`cuda` features): candle's CPU backend
# dispatches on CPU features at *runtime* (via the `gemm` crate), unlike
# whisper-rs-sys's GGML_NATIVE, which bakes `-march=native` in at *build*
# time. So there's no equivalent "built on one CI runner, SIGILLs on
# another" risk here — intentionally not enabling any accelerated backend,
# to keep the CPU path portable across runner generations.
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"

# OPUS-MT models ship raw SentencePiece `.model` files (source.spm) and a
# plain vocab.json, not a HF `tokenizers` fast-tokenizer JSON — so the
# `tokenizers` crate alone can't load them directly. `rust_tokenizers` has a
# purpose-built, pure-Rust `MarianTokenizer` (reimplements SentencePiece's
# Viterbi segmentation + NFKC normalisation + Marian's `>>lang<<` prefix
# handling, reading `source.spm`/`vocab.json` directly) — used here instead
# of an FFI binding to the reference SentencePiece C++ library specifically
# because it's pure Rust: an FFI crate would statically vendor its own copy
# of protobuf-lite, which collides at link time with the one already
# bundled inside `ort`'s downloaded static `onnxruntime` (DEC-004).
rust_tokenizers = "8"

# ─── Build dependencies ───────────────────────────────────────────────────────

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
hound = "3.5.1"
tempfile = "3"
