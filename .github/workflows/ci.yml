name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # whisper-rs-sys defaults to GGML_NATIVE=ON, which bakes `-march=native`
  # into the ggml build for whichever CPU happens to build it. GitHub-hosted
  # runners aren't guaranteed the same host across cache restores, so a
  # binary built on one Ubuntu runner generation can SIGILL when the cargo
  # target-dir cache is restored onto a different one. Force the portable
  # baseline instead.
  GGML_NATIVE: "OFF"

jobs:
  check:
    name: Check & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            src/target
          key: cargo-check-v2-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'src/Cargo.lock') }}
          restore-keys: |
            cargo-check-v2-${{ runner.os }}-

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: "latest"

      - name: cargo fmt (frontend)
        working-directory: src
        run: cargo fmt --all -- --check

      - name: cargo clippy (frontend)
        working-directory: src
        run: cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings

      - name: trunk build
        working-directory: src
        run: trunk build

      - name: cargo test (frontend)
        working-directory: src
        # Host target, not wasm32-unknown-unknown: this crate has no [lib]
        # target, and `cargo test --bin` compiles and links cleanly against
        # the host despite depending on wasm-bindgen/web-sys/tauri-sys, since
        # the tested functions are pure logic that never touches a JS/DOM
        # binding — no browser or Node.js test runner needed.
        run: cargo test --bin polyvocal-ui

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-test-v2-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-test-v2-${{ runner.os }}-

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev

      # tests/pipeline_integration.rs downloads real Whisper + Silero models
      # over the network. Pin Rust's temp dir to a stable, cacheable path
      # (std::env::temp_dir() honors TMPDIR/TMP/TEMP) so repeat CI runs hit
      # a warm cache instead of re-downloading tens of MB of model weights,
      # which matters most on the slower/colder macOS and Windows runners.
      - name: Cache downloaded models
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/polyvocal_integration_test_models
          key: models-${{ runner.os }}-${{ hashFiles('src-tauri/tests/pipeline_integration.rs') }}

      - name: cargo test
        working-directory: src-tauri
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: cargo test --all
