name: Security audit

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  pull_request:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  schedule:
    # RustSec's advisory database changes independently of this repo's
    # commits — a dependency pinned today can grow a disclosed
    # vulnerability tomorrow with no Cargo.lock change to trigger the
    # path-filtered runs above. Catch that with a weekly sweep.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  audit:
    name: cargo audit (${{ matrix.working-directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        working-directory: [src-tauri, src]
    steps:
      - uses: actions/checkout@v4

      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ${{ matrix.working-directory }}
