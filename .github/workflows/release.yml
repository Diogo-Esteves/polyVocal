name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # whisper-rs-sys defaults to GGML_NATIVE=ON, which bakes `-march=native`
  # into the ggml build for whichever CPU happens to build it. GitHub-hosted
  # runners aren't guaranteed the same host across cache restores, so a
  # binary built on one Ubuntu runner generation can SIGILL when the cargo
  # target-dir cache is restored onto a different one. Force the portable
  # baseline instead.
  GGML_NATIVE: "OFF"

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            src/target
          key: cargo-release-v1-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'src/Cargo.lock') }}
          restore-keys: |
            cargo-release-v1-${{ runner.os }}-

      - name: Install Tauri system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: "latest"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build app bundles
        run: cargo tauri build --bundles deb,appimage

      # The AppImage bundler (linuxdeploy) packages its own copies of the
      # Wayland client libraries into usr/lib, built against a much older
      # base than most users' systems ship. AppImage's runtime prioritizes
      # those bundled libs over the host's via LD_LIBRARY_PATH, and on
      # newer Wayland/Mesa stacks (confirmed on Arch/amdgpu) the version
      # mismatch makes webkit2gtk's EGL init fail with "Could not create
      # default EGL display: EGL_BAD_PARAMETER", leaving a blank window
      # (#136) — even though the same libraries work fine for a native,
      # non-AppImage build on the same machine. Stripping them out and
      # repackaging lets the AppImage fall back to the host's own Wayland
      # libs instead, which is what fixes it.
      - name: Strip bundled Wayland libs from the AppImage (#136)
        run: |
          set -e
          appimage=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage')
          workdir=$(mktemp -d)
          cp "$appimage" "$workdir/app.AppImage"
          cd "$workdir"
          chmod +x app.AppImage
          ./app.AppImage --appimage-extract
          rm -f squashfs-root/usr/lib/libwayland-egl.so.1 \
                squashfs-root/usr/lib/libwayland-client.so.0 \
                squashfs-root/usr/lib/libwayland-server.so.0 \
                squashfs-root/usr/lib/libwayland-cursor.so.0
          curl -fL -o appimagetool.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run squashfs-root "$OLDPWD/$appimage"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "PolyVocal ${{ github.ref_name }}"
          draft: true
          prerelease: true
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
