name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # whisper-rs-sys defaults to GGML_NATIVE=ON, which bakes `-march=native`
  # into the ggml build for whichever CPU happens to build it. GitHub-hosted
  # runners aren't guaranteed the same host across cache restores, so a
  # binary built on one Ubuntu runner generation can SIGILL when the cargo
  # target-dir cache is restored onto a different one. Force the portable
  # baseline instead.
  GGML_NATIVE: "OFF"

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            src/target
          key: cargo-release-v1-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'src/Cargo.lock') }}
          restore-keys: |
            cargo-release-v1-${{ runner.os }}-

      - name: Install Tauri system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: "latest"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PolyVocal ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: true
          args: --bundles deb,appimage
